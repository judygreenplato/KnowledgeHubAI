trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:

# ============================================================
# .NET
# ============================================================

# Install .NET 8 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

# Restore NuGet packages
- task: DotNetCoreCLI@2
  displayName: 'Restore .NET dependencies'
  inputs:
    command: 'restore'
    projects: 'KnowledgeHubAI.sln'

# Build the solution
- task: DotNetCoreCLI@2
  displayName: 'Build .NET solution'
  inputs:
    command: 'build'
    projects: 'KnowledgeHubAI.sln'
    arguments: '--configuration Release --no-restore'

# Run unit tests
- task: DotNetCoreCLI@2
  displayName: 'Run .NET unit tests'
  inputs:
    command: 'test'
    projects: 'KnowledgeHub.Tests/KnowledgeHub.Tests.csproj'
    arguments: '--configuration Release --no-build'
    publishTestResults: true


# ============================================================
# PYTHON
# ============================================================

- task: UsePythonVersion@0
  displayName: 'Install Python 3.12'
  inputs:
    versionSpec: '3.12'

- script: |
    python --version
    python -m pip --version
  displayName: 'Verify Python installation'
  workingDirectory: 'KnowledgeHub.Agent'

- script: |
    python -m pip install --upgrade pip
    python -m pip install -r requirements.txt
  displayName: 'Install Python dependencies'
  workingDirectory: 'KnowledgeHub.Agent'

- script: |
    python -m pytest
  displayName: 'Run Python unit tests'
  workingDirectory: 'KnowledgeHub.Agent'


# ============================================================
# REACT
# ============================================================

- task: NodeTool@0
  displayName: 'Install Node.js 24'
  inputs:
    versionSpec: '24.x'

- script: |
    node --version
    npm --version
  displayName: 'Verify Node.js installation'

- script: |
    npm ci
  displayName: 'Install React dependencies'
  workingDirectory: 'frontend/knowledgehub-ui'

- script: |
    npm run lint
  displayName: 'Run React lint'
  workingDirectory: 'frontend/knowledgehub-ui'

- script: |
    npm run build
  displayName: 'Build React application'
  workingDirectory: 'frontend/knowledgehub-ui'

